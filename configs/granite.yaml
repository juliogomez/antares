# ibm-granite/granite-4.0-1b, historical only (not part of evaluation)
#
# We ran one full sweep early in this POC; it scored 0% hit@any. Output: runs/granite-full.
# Do not use for headline numbers. See README.md "Historical".
#
# If you must re-run: serve WITHOUT the Antares shim (native mlx-lm tool parser).

model:
  api_base: "http://127.0.0.1:8081/v1"
  name: ""            # set by run_eval.py
  runner: "vllm"      # /v1/chat/completions with tools + tool_choice=auto

agent:
  max_turns: 20
  max_terminal_calls: 15
  temperature: 0.3
  max_tokens: 16384
  frequency_penalty: 0.3

sandbox:
  image: "vulnerability-localization-benchmark-sandbox"
  cpus: 2
  memory: "4g"
  network: "none"
  command_timeout: 10

eval:
  phases: "ab"
  workers: 1
  resume: true

data:
  manifest: "vendor/vloc-bench/data/manifest.csv"
  zips_dir: "data/ghsa-vulns"
